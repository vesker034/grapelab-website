stages:
  - build
  - deploy

variables:
  DOCKER_BUILDKIT: "1"

build-image:
  stage: build
  tags:
    - build
  image: docker:29.1.3
  script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - docker build -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG" .
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        docker tag "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG"
      fi
    - docker push --all-tags "$CI_REGISTRY_IMAGE"
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/ && $CI_COMMIT_REF_PROTECTED == "true"'

deploy-stage:
  stage: deploy
  tags:
    - deploy
  needs:
    - build-image
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - cd "$DEPLOY_DIR_STAGE"
    - cat "$ENV_STAGE" > .env
    - export APP_IMAGE="$CI_REGISTRY_IMAGE"
    - export APP_TAG="$CI_COMMIT_REF_SLUG"
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - docker compose -f docker-compose.yml pull web
    - docker compose -f docker-compose.yml up -d web --remove-orphans

deploy-prod:
  stage: deploy
  tags:
    - deploy
  needs:
    - build-image
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/ && $CI_COMMIT_REF_PROTECTED == "true"'
  script:
    - cd "$DEPLOY_DIR_PROD"
    - cat "$ENV_PROD" > .env
    - export APP_IMAGE="$CI_REGISTRY_IMAGE"
    - export APP_TAG="$CI_COMMIT_TAG"
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - docker compose -f docker-compose.yml pull web
    - docker compose -f docker-compose.yml up -d web --remove-orphans
